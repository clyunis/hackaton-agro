[project]
name = "asistente-agro"
version = "0.1.0"
description = "Asistente agronomico RAG sobre marbetes CASAFE, servido por Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-anthropic>=1.4.6",
    "langchain-core>=1.4.8",
    "langchain-text-splitters>=1.0.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.0",
    "sentence-transformers==5.6.0",
    "transformers==5.14.1",
    "torch>=2.4.0",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
